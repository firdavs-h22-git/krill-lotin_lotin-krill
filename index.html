<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiril ⇄ Lotin konverter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1a1d29;--mut:#6b7185;--ac:#2f6df6;--acfg:#fff;--bd:#dfe3ee;--ok:#18864b;--er:#c2362b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--fg:#eceef6;--mut:#9aa1b8;--ac:#5b8cff;--acfg:#0b1020;--bd:#2c3042;--ok:#4cc486;--er:#ff7a70}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--fg:#eceef6;--mut:#9aa1b8;--ac:#5b8cff;--acfg:#0b1020;--bd:#2c3042;--ok:#4cc486;--er:#ff7a70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
h2{font-size:18px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.btn:active,.btn:hover{border-color:var(--ac)}
.btn b{display:block;font-size:18px}
.btn span{color:var(--mut);font-size:14px}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:6px 0;cursor:pointer;margin-top:4px}
.drop{display:block;border:2px dashed var(--bd);border-radius:14px;padding:30px 12px;text-align:center;cursor:pointer;color:var(--mut)}
.drop:hover,.drop.hot{border-color:var(--ac);background:var(--bg)}
.drop input{display:none}
.drop strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
#st{margin-top:14px;min-height:22px;color:var(--mut)}
#st.ok{color:var(--ok)}#st.er{color:var(--er)}
.go{display:none;width:100%;margin-top:12px;background:var(--ac);color:var(--acfg);border:0;border-radius:12px;padding:14px;font:600 17px inherit;font-family:inherit;cursor:pointer}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1}
#ov div{border:3px dashed var(--ac);border-radius:24px;padding:48px 36px;text-align:center;font-size:20px;font-weight:600;color:var(--ac);background:var(--card);animation:pulse 1.1s ease-in-out infinite}
#ov i{display:block;font-style:normal;font-size:44px;animation:bob .9s ease-in-out infinite}
.drop.hot{animation:pulse 1.1s ease-in-out infinite}
.drop.land{animation:land .45s ease-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
@keyframes land{0%{transform:scale(1.08);border-color:var(--ok)}60%{transform:scale(.97)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#ov div,#ov i,.drop.hot{animation:none}}
a.go{text-align:center;text-decoration:none}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:13px;color:var(--mut);margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="ov"><div><i>⬇</i>Faylni shu yerga tashlang</div></div>
<main>
<h1>Kiril ⇄ Lotin</h1>
<p class="sub">Word, PDF va matn fayllarini oʻtkazing. Word faylda shrift va dizayn oʻzgarmaydi.</p>

<section id="s1" class="card">
<h2>Qaysi yoʻnalish?</h2>
<button class="btn" data-dir="c2l"><b>Кирилдан лотинга</b><span>Kiril → Lotin</span></button>
<button class="btn" data-dir="l2c"><b>Lotindan kirilga</b><span>Lotin → Kiril</span></button>
</section>

<section id="s2" class="card" hidden>
<h2>Qaysi lotin alifbosiga?</h2>
<button class="btn" data-ver="new"><b>Yangi alifbo</b><span>ш → ş, ч → ç, ғ → ğ, ў → ö, ц → s</span></button>
<button class="btn" data-ver="old"><b>Eski alifbo</b><span>sh, ch, g‘, o‘ — hozirgacha qoʻllanilayotgan alifbo</span></button>
<button class="back" data-back="s1">← Orqaga</button>
</section>

<section id="s3" class="card" hidden>
<span class="tag" id="tag"></span>
<label class="drop"><input id="f" type="file" accept=".docx,.pdf,.txt"><strong>Faylni shu yerga tashlang yoki tanlang</strong>.docx, .pdf yoki .txt</label>
<div id="st"></div>
<button class="go" id="conv">Konvert qilish</button>
<a class="go" id="dl" href="#">Yuklab olish</a>
<button class="back" id="b3">← Boshidan</button>
</section>
</main>
<script>
var dir=null,ver="new",result=null;
var $=function(i){return document.getElementById(i)};
function show(id){["s1","s2","s3"].forEach(function(s){$(s).hidden=(s!==id)})}
function status(t,c){var e=$("st");e.textContent=t;e.className=c||""}

/* ---------- alifbo jadvallari ---------- */
var C2L={"а":"a","б":"b","в":"v","г":"g","д":"d","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ч":"ch","ш":"sh","ъ":"ʼ","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o‘","қ":"q","ғ":"g‘","ҳ":"h"};
var NEWX={"ш":"ş","ч":"ç","ғ":"ğ","ў":"ö"};
var L2C={"a":"а","b":"б","v":"в","d":"д","f":"ф","g":"г","h":"ҳ","i":"и","j":"ж","k":"к","l":"л","m":"м","n":"н","o":"о","p":"п","q":"қ","r":"р","s":"с","t":"т","u":"у","x":"х","y":"й","z":"з","e":"е"};
var VOW="аеёиоуэюяўыъьАЕЁИОУЭЮЯЎЫ";
function isCyr(c){return /[\u0400-\u04FF]/.test(c||"")}
function isUp(c){return !!c&&c!==c.toLowerCase()&&c===c.toUpperCase()}
function cap(s,all){return all?s.toUpperCase():s.charAt(0).toUpperCase()+s.slice(1)}

function makeC2L(version){
  var prev="";
  return function(s){
    var out="";
    for(var i=0;i<s.length;i++){
      var c=s[i],l=c.toLowerCase(),nx=s[i+1],m;
      if(!isCyr(c)||!(l in C2L||l==="е"||l==="ц"||l==="щ")){out+=c;prev=c;continue}
      var up=isUp(c),all=up&&(isUp(nx)&&isCyr(nx)||isUp(prev)&&isCyr(prev));
      if(l==="е"){m=(!isCyr(prev)&&!/[A-Za-z]/.test(prev)||VOW.indexOf(prev)>-1)?"ye":"e"}
      else if(l==="ц"){m="s"}
      else if(l==="щ"){m=version==="old"?"sh":"ş"}
      else if(version!=="old"&&NEWX[l])m=NEWX[l];
      else m=C2L[l];
      out+=m.length>1&&/[a-z]/.test(m)?(up?cap(m,all):m):(up?m.toUpperCase():m);
      prev=c;
    }
    return out;
  };
}
function makeL2C(){
  var AP="ʻʼ'’‘`";
  return function(s){
    var out="";
    for(var i=0;i<s.length;i++){
      var c=s[i],l=c.toLowerCase(),nx=s[i+1]||"",n=nx.toLowerCase(),p=s[i-1]||"",two=l+n,m=null,len=1,up=isUp(c);
      var sp={"ş":"ш","ç":"ч","ğ":"ғ","ö":"ў","ó":"ў","ǵ":"ғ"};
      if(sp[l]){out+=up?sp[l].toUpperCase():sp[l];continue}
      if(!/[A-Za-z]/.test(c)){
        if(AP.indexOf(c)>-1&&/[A-Za-z]/.test(p)&&/[A-Za-z]/.test(nx)){out+="ъ"}else out+=c;
        continue;
      }
      if(two==="sh"){m="ш";len=2}
      else if(two==="ch"){m="ч";len=2}
      else if(two==="yo"){m="ё";len=2}
      else if(two==="yu"){m="ю";len=2}
      else if(two==="ya"){m="я";len=2}
      else if(two==="ye"){m="е";len=2}
      else if(two==="ts"){m="ц";len=2}
      else if((l==="o"||l==="g")&&nx&&AP.indexOf(nx)>-1){m=l==="o"?"ў":"ғ";len=2}
      else if(l==="e"&&!/[A-Za-zşçğöóǵŞÇĞÖ]/.test(p)){m="э"}
      else m=L2C[l]||c;
      out+=up?m.toUpperCase():m;
      i+=len-1;
    }
    return out;
  };
}
function getConv(){return dir==="c2l"?makeC2L(ver):makeL2C()}

/* ---------- XML belgilar ---------- */
function dec(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&")}
function enc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ---------- DOCX ---------- */
async function doDocx(buf){
  var zip=await JSZip.loadAsync(buf);
  var names=Object.keys(zip.files).filter(function(n){return /^word\/(document|header\d*|footer\d*|footnotes|endnotes|comments)\.xml$/.test(n)});
  for(var k=0;k<names.length;k++){
    var xml=await zip.file(names[k]).async("string"),conv=getConv();
    xml=xml.replace(/<w:t(\s[^>]*)?>([^<]*)<\/w:t>/g,function(_,a,t){return "<w:t"+(a||"")+">"+enc(conv(dec(t)))+"</w:t>"});
    zip.file(names[k],xml);
  }
  return await zip.generateAsync({type:"uint8array",compression:"DEFLATE"});
}

function b64(x){var t=atob(x),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
async function doPdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var src=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  var doc=await PDFLib.PDFDocument.load(buf.slice(0),{ignoreEncryption:true});
  if(typeof fontkit==="undefined")throw new Error("Shrift kutubxonasi yuklanmadi. Internetni tekshiring.");
  doc.registerFontkit(fontkit);
  var fR=await doc.embedFont(b64(FR),{subset:true}),fB=await doc.embedFont(b64(FB),{subset:true}),total=0;
  var okR=new Set(fR.getCharacterSet()),okB=new Set(fB.getCharacterSet());
  for(var i=0;i<src.numPages;i++){
    status("PDF oʻtkazilmoqda: "+(i+1)+" / "+src.numPages+" sahifa…");
    var pg=await src.getPage(i+1),tc=await pg.getTextContent(),out=doc.getPage(i),conv=getConv(),boldOf={};
    try{await pg.getOperatorList()}catch(_){}
    for(var fn in tc.styles){
      boldOf[fn]=false;
      try{if(pg.commonObjs.has(fn)){var fo=pg.commonObjs.get(fn);boldOf[fn]=/bold|black|heavy/i.test((fo&&(fo.name||fo.loadedName))||"")}}catch(_){}
    }
    for(var j=0;j<tc.items.length;j++){
      var it=tc.items[j];if(!it.str||!it.str.trim())continue;
      var t=conv(it.str);total+=t.length;
      var h=it.height||Math.hypot(it.transform[0],it.transform[1])||10,x=it.transform[4],y=it.transform[5];
      var bold=!!boldOf[it.fontName],font=bold?fB:fR,ok=bold?okB:okR;
      var safe=t.replace(/\u02bb/g,"\u2018").split("").map(function(ch){return ok.has(ch.codePointAt(0))?ch:"?"}).join("");
      out.drawRectangle({x:x-0.5,y:y-h*0.25,width:it.width+1,height:h*1.2,color:PDFLib.rgb(1,1,1)});
      var size=h*0.95,w=font.widthOfTextAtSize(safe,size);
      if(w>it.width&&it.width>0)size=Math.max(3,size*it.width/w);
      out.drawText(safe,{x:x,y:y,size:size,font:font,color:PDFLib.rgb(0,0,0)});
    }
  }
  if(!total)throw new Error("Bu PDFda matn topilmadi (skaner qilingan rasm boʻlishi mumkin).");
  return await doc.save();
}

/* ---------- fayl tanlash va konvert ---------- */
var picked=null,dlUrl=null;
var MIME={docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",pdf:"application/pdf",txt:"text/plain;charset=utf-8"};
$("f").addEventListener("change",function(){
  var f=this.files[0];
  $("dl").style.display="none";
  if(!f){picked=null;$("conv").style.display="none";status("");return}
  picked=f;status("Tanlandi: "+f.name,"");$("conv").style.display="block";
});
$("conv").addEventListener("click",async function(){
  if(!picked)return;
  var f=picked;
  $("conv").disabled=true;$("dl").style.display="none";status("Konvert qilinmoqda…");
  try{
    var ext=f.name.split(".").pop().toLowerCase(),buf=await f.arrayBuffer(),data;
    if(ext==="docx")data=await doDocx(buf);
    else if(ext==="pdf")data=await doPdf(new Uint8Array(buf));
    else if(ext==="txt")data=getConv()(new TextDecoder().decode(buf));
    else throw new Error("Faqat .docx, .pdf yoki .txt fayl yuklang.");
    if(dlUrl)URL.revokeObjectURL(dlUrl);
    dlUrl=URL.createObjectURL(new Blob([data],{type:MIME[ext]}));
    var name=f.name.replace(/\.[^.]+$/,"")+(dir==="c2l"?"_lotin.":"_kiril.")+ext;
    var a=$("dl");a.href=dlUrl;a.download=name;a.textContent="Yuklab olish: "+name;a.style.display="block";
    status("Tayyor!","ok");
  }catch(e){status("Xatolik: "+(e.message||e),"er")}
  $("conv").disabled=false;
});

var dz=document.querySelector(".drop"),ov=$("ov"),depth=0;
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1}
function canDrop(){return !$("s3").hidden}
function takeFile(fl){
  if(!fl||!fl.length)return;
  try{$("f").files=fl}catch(_){}
  if($("f").files&&$("f").files.length)$("f").dispatchEvent(new Event("change"));
  else{picked=fl[0];$("dl").style.display="none";status("Tanlandi: "+fl[0].name,"");$("conv").style.display="block"}
  dz.classList.remove("land");void dz.offsetWidth;dz.classList.add("land");
}
window.addEventListener("dragenter",function(e){e.preventDefault();if(!hasFiles(e)||!canDrop())return;depth++;ov.classList.add("on");dz.classList.add("hot")});
window.addEventListener("dragover",function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect=canDrop()?"copy":"none"});
window.addEventListener("dragleave",function(e){e.preventDefault();if(!hasFiles(e))return;depth=Math.max(0,depth-1);if(!depth){ov.classList.remove("on");dz.classList.remove("hot")}});
window.addEventListener("drop",function(e){
  e.preventDefault();depth=0;ov.classList.remove("on");dz.classList.remove("hot");
  if(canDrop())takeFile(e.dataTransfer&&e.dataTransfer.files);
});

document.querySelectorAll("[data-dir]").forEach(function(b){b.addEventListener("click",function(){
  dir=b.dataset.dir;
  if(dir==="c2l")show("s2");else{$("tag").textContent="Lotin → Kiril";show("s3")}
})});
document.querySelectorAll("[data-ver]").forEach(function(b){b.addEventListener("click",function(){
  ver=b.dataset.ver;$("tag").textContent="Kiril → Lotin ("+(ver==="new"?"yangi":"eski")+" alifbo)";show("s3")
})});
document.querySelectorAll("[data-back]").forEach(function(b){b.addEventListener("click",function(){show(b.dataset.back)})});
$("b3").addEventListener("click",function(){$("f").value="";result=null;$("conv").style.display="none";$("dl").style.display="none";picked=null;status("");show("s1")});
</script>
